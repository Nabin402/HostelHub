<!-- templates/accounts/login.html -->
{% extends 'base.html' %}
{% load static %}

{% block title %}Login - HostelHub{% endblock %}

{% block content %}
<div class="auth-card">
    <h2>Welcome Back</h2>
    <p class="subtitle">Login to your HostelHub account</p>

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label fw-semibold">Username</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" name="username" class="form-control" placeholder="Enter your username" required>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold">Password</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
                <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                    <i class="bi bi-eye" id="eyeIcon"></i>
                </button>
            </div>
        </div>

        <button type="submit" class="btn btn-primary mt-2">
            <i class="bi bi-box-arrow-in-right"></i> Login
        </button>
    </form>

    <div class="divider">or</div>

    <div class="text-center">
        <p class="mb-1">Don't have an account?</p>
        <a href="{% url 'register_student' %}" class="btn btn-outline-secondary mb-2">
            <i class="bi bi-mortarboard"></i> Register as Student
        </a>
        <a href="{% url 'register_owner' %}" class="btn btn-outline-secondary">
            <i class="bi bi-building-add"></i> Register as Owner
        </a>
    </div>
</div>

{% block extra_js %}
<script>
    document.getElementById('togglePassword').addEventListener('click', function () {
        const pwd = document.querySelector('input[name="password"]');
        const icon = document.getElementById('eyeIcon');
        if (pwd.type === 'password') {
            pwd.type = 'text';
            icon.classList.replace('bi-eye', 'bi-eye-slash');
        } else {
            pwd.type = 'password';
            icon.classList.replace('bi-eye-slash', 'bi-eye');
        }
    });
</script>
{% endblock %}

{% endblock %}
