<!-- templates/accounts/verify_email.html -->
{% extends 'base.html' %}

{% block title %}Verify Email - HostelHub{% endblock %}

{% block content %}
<div class="auth-card text-center">
    <i class="bi bi-envelope-check" style="font-size: 3rem; color: #0d6efd;"></i>
    <h2 class="mt-3">Verify Your Email</h2>
    <p class="subtitle">We sent a 6-digit code to <strong>{{ email }}</strong></p>

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <input type="text" name="code" class="form-control otp-input" maxlength="6" placeholder="000000" required
                autofocus>
        </div>

        <button type="submit" class="btn btn-primary">
            <i class="bi bi-check-circle"></i> Verify Email
        </button>
    </form>

    <div class="mt-3">
        <p class="text-muted">Didn't receive the code?
            <a href="{% url 'resend_otp' %}">Resend OTP</a>
        </p>
        <small class="text-muted">Code expires in 10 minutes</small>
    </div>
</div>
{% endblock %}
